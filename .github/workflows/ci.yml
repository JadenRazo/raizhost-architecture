name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: lint markdown + render diagram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md
            !node_modules

      - name: Render architecture source (fails on syntax errors)
        uses: docker://minlag/mermaid-cli:11.4.2
        with:
          args: -i diagrams/architecture.mmd -o /tmp/architecture.svg -c diagrams/mermaid-config.json -b transparent

      - name: Render request-flow source
        uses: docker://minlag/mermaid-cli:11.4.2
        with:
          args: -i diagrams/request-flow.mmd -o /tmp/request-flow.svg -c diagrams/mermaid-config.json -b transparent

      - name: Render deploy-flow source
        uses: docker://minlag/mermaid-cli:11.4.2
        with:
          args: -i diagrams/deploy-flow.mmd -o /tmp/deploy-flow.svg -c diagrams/mermaid-config.json -b transparent

      - name: Render client-provisioning source
        uses: docker://minlag/mermaid-cli:11.4.2
        with:
          args: -i diagrams/client-provisioning.mmd -o /tmp/client-provisioning.svg -c diagrams/mermaid-config.json -b transparent

      - name: Check mobile-safe embeds and render freshness
        run: python3 diagrams/check_docs.py

      - name: Diagram geometry check (text fits boxes, no line crosses text)
        run: |
          pip install --quiet fonttools brotli
          python3 diagrams/check.py diagrams/architecture.svg

      - name: Check for private identifiers
        run: |
          set -euo pipefail
          if grep -rnE '\b[0-9]{12}\b|\bi-0[0-9a-f]{8,}\b|\bE[0-9A-Z]{13}\b|\b[0-9]{1,3}(\.[0-9]{1,3}){3}\b|raizcloud-|arn:aws' --include='*.md' --include='*.mmd' . ; then
            echo "::error::private identifier pattern found"; exit 1
          fi
          echo "clean"
