name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: lint markdown + render diagram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !node_modules

      - name: Render every Mermaid source (fails on syntax errors)
        env:
          MERMAID_IMAGE: minlag/mermaid-cli@sha256:99c983b3ab4e14033f2880bc1b9de17e5090b4515dabd63fe9cf8c0ae6130956 # 11.4.2
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mermaid-check"
          for source in diagrams/*.mmd; do
            name="$(basename "${source}" .mmd)"
            docker run --rm --user "$(id -u):$(id -g)" \
              --volume "${GITHUB_WORKSPACE}:/data:ro" \
              --volume "${RUNNER_TEMP}/mermaid-check:/out" \
              "${MERMAID_IMAGE}" \
              -i "/data/${source}" -o "/out/${name}.svg" \
              -c /data/diagrams/mermaid-config.json -b white
          done

      - name: Install diagram font metrics
        run: pip install --quiet fonttools brotli

      - name: Check overview SVG and sketch match their shared graph
        run: python3 diagrams/overview.py --check

      - name: Check responsive embeds and render manifest
        run: python3 diagrams/check_docs.py

      - name: Diagram geometry check (text fits boxes, no line crosses text)
        run: |
          python3 diagrams/journeys.py --check
          python3 diagrams/journeys.py --self-test
          python3 diagrams/check.py
          if python3 diagrams/check.py ../../etc/passwd; then
            echo "::error::Geometry checker accepted a file-path override"
            exit 1
          fi

      - name: Check for private identifiers
        run: |
          set -euo pipefail
          if grep -rnE '\b[0-9]{12}\b|\bi-0[0-9a-f]{8,}\b|\bE[0-9A-Z]{13}\b|\b[0-9]{1,3}(\.[0-9]{1,3}){3}\b|raizcloud-|arn:aws' --include='*.md' --include='*.mmd' . ; then
            echo "::error::private identifier pattern found"; exit 1
          fi
          echo "clean"
